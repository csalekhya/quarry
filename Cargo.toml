[package]
name = "quarry"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A vectorized SQL query engine over Apache Arrow: recursive-descent parser, typed binder, rule-based optimizer, hash join/aggregate operators."
license = "MIT"
readme = "README.md"
default-run = "quarry"

[lib]
name = "quarry"
path = "src/lib.rs"

[[bin]]
name = "quarry"
path = "src/main.rs"

[dependencies]
arrow = { version = "=60.0.0", default-features = false, features = ["csv"] }
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap"] }
thiserror = "2.0.18"
rustc-hash = "2.1.1"
log = "0.4.27"
env_logger = { version = "0.11.5", default-features = false }
clap = { version = "4.5.20", features = ["derive"] }

[dev-dependencies]
rusqlite = { version = "=0.41.0", features = ["bundled"] }
proptest = "1.5.0"
tempfile = "3.20.0"

[profile.release]
debug = 1
